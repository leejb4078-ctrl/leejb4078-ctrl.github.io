            PieChartIcon: <><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></>,
            BookOpen: <><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>,
            Target: <><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></>,
            Map: <><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></>,
            Stethoscope: <><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></>,
            Wind: <><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></>,
            Landmark: <><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7"/></>,

        const Icon = memo(({ name, className, onClick }) => {
            const IconElement = ICON_PATHS[name] || ICON_PATHS.CircleDollarSign;
            return <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className || ""} onClick={onClick}>{IconElement}</svg>;
        });

        // ─── 4. MODALS ────────────────────────────────────────────────────────────
        const CloudSyncModal = ({ onClose, onImport, onExport, holdings, gasUrl, setGasUrl }) => {
            const [mode, setMode] = useState('menu');
            const [inputData, setInputData] = useState("");
            const [status, setStatus] = useState("");
            const [geminiInput, setGeminiInput] = useState(() => localStorage.getItem('muang_groq_key') || "");
            const [savedKey, setSavedKey] = useState(() => localStorage.getItem('muang_groq_key') || "");
            const saveGeminiKey = () => {
                const trimmed = geminiInput.trim();
                localStorage.setItem('muang_groq_key', trimmed);
                setSavedKey(trimmed);
                setStatus("Groq API 키 저장 완료! ✓");
                setTimeout(() => { setStatus(""); onClose(); }, 1200);
            };

            const handleExportCopy = () => { onExport(); setStatus("복사됨"); setTimeout(() => setStatus(""), 2000); };
            const handleImportSave = () => {
                if (onImport(inputData)) { setStatus("성공"); setTimeout(onClose, 1000); }
                else { setStatus("실패"); setTimeout(() => setStatus(""), 2000); }
            };
            const saveToGoogleSheets = async () => {
                if (!gasUrl) { alert("API URL을 입력해주세요."); return; }
                setStatus("저장 중...");
                try {
                    await fetch(gasUrl, { method: 'POST', body: JSON.stringify({ type: 'save', holdings }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }});
                    setStatus("구글 시트 저장 완료!"); setTimeout(() => { setStatus(""); onClose(); }, 1500);
                } catch (e) { setStatus("저장 실패. URL 확인 필요"); setTimeout(() => setStatus(""), 3000); }
            };
            const loadFromGoogleSheets = async () => {
                if (!gasUrl) { alert("API URL을 입력해주세요."); return; }
                setStatus("불러오는 중...");
                try {
                    const response = await fetch(gasUrl); const data = await response.text();
                    if (onImport(data)) { setStatus("구글 시트 불러오기 완료!"); setTimeout(() => { setStatus(""); onClose(); }, 1500); }
                    else { setStatus("불러오기 실패: 데이터 오류"); setTimeout(() => setStatus(""), 3000); }
                } catch (e) { setStatus("불러오기 실패. URL 확인 필요"); setTimeout(() => setStatus(""), 3000); }
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 flex items-end md:items-center justify-center z-[100] p-0 md:p-4 backdrop-blur-sm" onClick={onClose}>
                    <div className="bg-white rounded-t-3xl md:rounded-3xl w-full max-w-md shadow-2xl overflow-hidden" onClick={e => e.stopPropagation()}>
                        <div className="p-4 flex justify-between items-center border-b border-slate-100 bg-slate-800 text-white">
                            <h3 className="font-bold text-lg flex items-center gap-2"><Icon name="Cloud" className="text-blue-400" /> 클라우드 연동 설정</h3>
                            <button onClick={onClose} type="button" className="p-2 hover:bg-slate-700 rounded-full"><Icon name="X" /></button>
                        </div>
                        <div className="p-6">
                            {mode === 'menu' && (
                                <div className="space-y-3">
                                    <div className="bg-blue-50 text-blue-800 p-4 rounded-xl text-xs font-bold mb-4 flex items-start gap-2 border border-blue-100">
                                        <Icon name="Bot" className="shrink-0"/><span>한 번만 URL을 입력해두면,{" "}<strong>백그라운드에서 자동 동기화</strong>됩니다.</span>
                                    </div>
                                    <button onClick={() => setMode('google')} type="button" className="w-full py-4 bg-blue-700 text-white font-bold rounded-xl flex items-center justify-center gap-2 hover:bg-blue-800 shadow-lg"><Icon name="Activity" /> 구글 스프레드시트 API 설정</button>
                                    <button onClick={() => setMode('gemini')} type="button" className="w-full py-4 bg-orange-500 text-white font-bold rounded-xl flex items-center justify-center gap-2 hover:bg-orange-600 shadow-lg"><Icon name="Zap" /> Groq API 키 설정 (뉴스/AI, 무료)</button>
                                    <div className="h-px bg-slate-100 my-4"></div>
                                    <button onClick={() => setMode('manual')} type="button" className="w-full py-3.5 bg-slate-100 text-slate-700 font-bold rounded-xl flex items-center justify-center gap-2 hover:bg-slate-200"><Icon name="Edit3" /> 수동으로 텍스트 복사/붙여넣기</button>
                                </div>
                            )}
                            {mode === 'google' && (
                                <div className="space-y-4">
                                    <label className="block text-sm font-bold text-slate-700">Google Apps Script URL 입력</label>
                                    <input type="text" value={gasUrl} onChange={(e) => setGasUrl(e.target.value)} placeholder="https://script.google.com/..." className="w-full p-3 border border-slate-200 rounded-xl text-xs font-mono focus:ring-2 focus:ring-blue-600 outline-none"/>
                                    <p className="text-[10px] text-slate-500">URL을 넣고 창을 닫으면 실시간 시세 및 자산 연동이 시작됩니다.</p>
                                    <div className="flex gap-2 pt-2">
                                        <button onClick={saveToGoogleSheets} type="button" className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl flex justify-center items-center gap-2 text-xs"><Icon name="Upload" className="w-3 h-3"/> (수동) 강제 덮어쓰기</button>
                                        <button onClick={loadFromGoogleSheets} type="button" className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl flex justify-center items-center gap-2 text-xs"><Icon name="Download" className="w-3 h-3"/> (수동) 강제 불러오기</button>
                                    </div>
                                    {status && <div className="text-center text-sm font-bold text-blue-700 mt-2">{status}</div>}
                                    <button onClick={() => setMode('menu')} type="button" className="text-sm text-slate-500 hover:text-slate-800 w-full text-center mt-4 underline underline-offset-2">뒤로가기</button>
                                </div>
                            )}
                            {mode === 'gemini' && (
                                <div className="space-y-4">
                                    <div className="bg-indigo-50 border border-indigo-100 rounded-xl p-4 text-xs text-indigo-800 font-bold flex items-start gap-2">
                                        <Icon name="Sparkles" className="shrink-0 text-indigo-600 mt-0.5"/>
                                        <span>Groq API 키를 입력하면 <strong>AI 뉴스 새로고침</strong>과 <strong>AI 포트폴리오 진단</strong>이 작동합니다.<br/><span className="font-normal text-orange-600 mt-1 block">console.groq.com → API Keys → Create API key (완전 무료)</span></span>
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-sm font-bold text-slate-700">Groq API Key</label>
                                        <input type="password" value={geminiInput} onChange={e=>setGeminiInput(e.target.value)}
                                            placeholder="AIza..."
                                            className="w-full p-3 border border-slate-200 rounded-xl text-sm font-mono focus:ring-2 focus:ring-indigo-500 outline-none"/>
                                        <p className="text-[10px] text-slate-400">키는 기기 내 로컬에만 저장되며 외부로 전송되지 않습니다.</p>
                                    </div>
                                    {geminiInput && savedKey === geminiInput && (
                                        <div className="flex items-center gap-2 text-emerald-700 text-xs font-bold bg-emerald-50 border border-emerald-100 rounded-xl p-3">
                                            <span className="w-2 h-2 bg-emerald-500 rounded-full inline-block"></span> 현재 저장된 키와 동일합니다
                                        </div>
                                    )}
                                    <button onClick={saveGeminiKey} type="button" className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-xl shadow-lg">저장</button>
                                    {status && <div className="text-center text-sm font-bold text-indigo-700">{status}</div>}
                                    <button onClick={() => setMode('menu')} type="button" className="text-sm text-slate-500 hover:text-slate-800 w-full text-center mt-2 underline underline-offset-2">뒤로가기</button>
                                </div>
                            )}
                            {mode === 'manual' && (
                                <div className="space-y-4">
                                    <p className="text-xs text-slate-500 font-bold mb-2">1. 현재 데이터 내보내기</p>
                                    <button onClick={handleExportCopy} type="button" className={`w-full py-3 ${status === '복사됨' ? 'bg-green-500' : 'bg-slate-800'} text-white font-bold rounded-xl text-sm flex justify-center gap-2`}>
                                        <Icon name={status === '복사됨' ? 'Check' : 'Download'} className="w-4 h-4"/> {status === '복사됨' ? '클립보드에 복사 완료!' : '복사해서 카톡으로 보내기'}
                                    </button>
                                    <hr className="my-4"/>
                                    <p className="text-xs text-slate-500 font-bold mb-2">2. 다른 기기 데이터 불러오기</p>
                                    <textarea className="w-full h-24 p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-blue-600 outline-none resize-none" placeholder="카톡에서 복사한 데이터를 붙여넣으세요..." value={inputData} onChange={(e) => setInputData(e.target.value)} />
                                    <button onClick={handleImportSave} type="button" className={`w-full py-3 ${status === '성공' ? 'bg-green-500' : (status === '실패' ? 'bg-red-500' : 'bg-blue-700')} text-white font-bold rounded-xl text-sm`}>
                                        {status === '성공' ? '적용 완료!' : (status === '실패' ? '데이터 오류' : '데이터 적용하기')}
                                    </button>
                                    <button onClick={() => setMode('menu')} type="button" className="text-sm text-slate-500 hover:text-slate-800 w-full text-center mt-2 underline underline-offset-2">뒤로가기</button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const CategoryModal = ({ categoryKey, holdings, assetSummary, onClose, marketData, currency }) => {
            if (!categoryKey || !holdings || !assetSummary) return null;
            const categoryItems = holdings[categoryKey] || [];
            const categoryTotal = assetSummary[categoryKey];
            const detailData = categoryItems.map(item => ({ name: item.name, value: getEstimatedValueKRW(item, marketData) })).sort((a,b) => b.value - a.value);
            const COLORS = ['#1d4ed8','#3b82f6','#93c5fd','#bfdbfe','#facc15','#fef08a','#ef4444','#f87171'];
            return (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[100] animate-fadeIn p-4 backdrop-blur-sm" onClick={onClose}>
                    <div className="bg-white rounded-3xl w-full max-w-md shadow-2xl overflow-hidden" onClick={e => e.stopPropagation()}>
                        <div className="bg-slate-800 p-5 flex justify-between items-center text-white">
                            <h3 className="font-bold text-lg flex items-center gap-2"><Icon name="Activity" className="text-blue-400" /> 상세 분석</h3>
                            <button onClick={onClose} type="button" className="hover:bg-white/10 p-2 rounded-full"><Icon name="X" /></button>
                        </div>
                        <div className="p-6">
                            <div className="h-64 relative mb-6">
                                <ResponsiveContainer width="100%" height="100%">
                                    <PieChart>
                                        <Pie data={detailData} cx="50%" cy="50%" innerRadius={60} outerRadius={80} paddingAngle={2} dataKey="value">
                                            {detailData.map((entry, index) => <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />)}
                                        </Pie>
                                        <Tooltip formatter={(val) => formatCurrencyShort(val, currency, marketData.exchangeRate)} />
                                    </PieChart>
                                </ResponsiveContainer>
                                <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-center pointer-events-none">
                                    <div className="text-xs text-slate-400 font-bold uppercase">TOTAL</div>
                                    <div className="text-lg font-extrabold text-slate-800">{formatCurrencyShort(categoryTotal, currency, marketData.exchangeRate)}</div>
                                </div>
                            </div>
                            <div className="space-y-3 max-h-60 overflow-y-auto custom-scroll pr-2">
                                {detailData.map((item, idx) => (
                                    <div key={idx} className="flex justify-between items-center text-sm p-2 hover:bg-slate-50 rounded-xl">
                                        <div className="flex items-center gap-2 flex-1 min-w-0 mr-2">
                                            <div className="w-3 h-3 rounded-full shrink-0 shadow-sm" style={{backgroundColor: COLORS[idx % COLORS.length]}}></div>
                                            <span className="font-bold text-slate-700 truncate">{item.name}</span>
                                        </div>
                                        <div className="flex items-center justify-end gap-3 shrink-0">
                                            <span className="font-black text-slate-900">{formatCurrency(item.value, currency, marketData.exchangeRate)}</span>
                                            <span className="text-[11px] font-bold text-slate-400 w-8 text-right">({((item.value/categoryTotal)*100).toFixed(1)}%)</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const AddModal = ({ category, onClose, onAdd }) => {
            const isCash = category === 'cash';
            const defaultType = category === 'crypto' ? 'BTC' : (category === 'usStock' ? 'USD' : 'KRW');
            const [newItem, setNewItem] = useState({ name: '', val: '', qty: '', avg: '', type: defaultType });

            const handleAdd = () => {
                if(!newItem.name) return;
                const saveObj = { name: newItem.name };
                if (isCash) { saveObj.val = parseFloat(newItem.val) || 0; saveObj.category = 'cash'; }
                else { saveObj.qty = parseFloat(newItem.qty) || 0; saveObj.avg = parseFloat(newItem.avg) || 0; saveObj.type = defaultType; }
                if (newItem.gTicker) saveObj.gTicker = newItem.gTicker.trim();
                onAdd(category, saveObj); onClose();
            };

            return (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[100] animate-fadeIn p-4 backdrop-blur-sm" onClick={onClose}>
                    <div className="bg-white rounded-3xl w-full max-w-sm shadow-2xl overflow-hidden" onClick={e => e.stopPropagation()}>
                        <div className="bg-slate-800 p-5 flex justify-between items-center text-white">
                            <h3 className="font-bold text-lg flex items-center gap-2"><div className="p-1.5 bg-blue-500/30 rounded-xl"><Icon name="Plus" className="w-5 h-5 text-blue-200" /></div>새 자산 추가</h3>
                            <button onClick={onClose} type="button" className="text-white/70 hover:text-white"><Icon name="X" /></button>
                        </div>
                        <div className="p-6 space-y-5">
                            <div className="space-y-2">
                                <label className="block text-xs font-bold text-slate-500 ml-1">자산명 (종목코드 또는 이름)</label>
                                <input type="text" value={newItem.name} onChange={(e) => setNewItem({...newItem, name: e.target.value})} placeholder="예: AAPL, 토스뱅크" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-lg font-bold text-slate-800 outline-none focus:border-blue-600 focus:bg-white" />
                            </div>
                            {isCash ? (
                                <div className="space-y-2">
                                    <label className="block text-xs font-bold text-slate-500 ml-1">현재 보유 금액</label>
                                    <div className="relative">
                                        <input type="text" value={formatWithCommas(newItem.val)} onChange={(e) => { let v = e.target.value.replace(/,/g,''); if(v.startsWith('-')||(v!==''&&!QTY_REGEX.test(v)))return; setNewItem({...newItem,val:v}); }} placeholder="0" className="w-full p-4 pr-12 bg-slate-50 border border-slate-200 rounded-2xl text-right text-lg font-bold text-slate-800 outline-none focus:border-blue-600 focus:bg-white" />
                                        <span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium">원</span>
                                    </div>
                                </div>
                            ) : (
                                <>
                                    <div className="space-y-2">
                                        <label className="block text-xs font-bold text-slate-500 ml-1">보유 수량</label>
                                        <div className="relative">
                                            <input type="text" value={formatWithCommas(newItem.qty)} onChange={(e) => { let v = e.target.value.replace(/,/g,''); if(v.startsWith('-')||(v!==''&&!QTY_REGEX.test(v)))return; setNewItem({...newItem,qty:v}); }} placeholder="0" className="w-full p-4 pr-12 bg-slate-50 border border-slate-200 rounded-2xl text-right text-lg font-bold text-slate-800 outline-none focus:border-blue-600 focus:bg-white" />
                                            <span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium">{newItem.type === 'BTC' ? 'BTC' : '주'}</span>
                                        </div>
                                    </div>
                                    <div className="space-y-2">
                                        <label className="block text-xs font-bold text-slate-500 ml-1">매수 평균 단가</label>
                                        <div className="relative">
                                            <input type="text" value={formatWithCommas(newItem.avg)} onChange={(e) => { let v = e.target.value.replace(/,/g,''); if(v.startsWith('-')||(v!==''&&!QTY_REGEX.test(v)))return; setNewItem({...newItem,avg:v}); }} placeholder="0" className="w-full p-4 pr-12 bg-slate-50 border border-slate-200 rounded-2xl text-right text-lg font-bold text-slate-800 outline-none focus:border-blue-600 focus:bg-white" />
                                            <span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium">{newItem.type === 'USD' ? '$' : '원'}</span>
                                        </div>
                                    </div>
                                </>
                            )}
                            {!isCash && (
                                <div className="space-y-1.5 pt-1 border-t border-slate-100">
                                    <label className="block text-xs font-bold text-slate-500 ml-1 flex items-center gap-1.5">
                                        <Icon name="Globe" className="w-3 h-3"/> 시세 티커 <span className="font-normal text-slate-400">(선택 — 구글 시트 자동 등록)</span>
                                    </label>
                                    <input type="text" value={newItem.gTicker||''} onChange={e=>setNewItem({...newItem,gTicker:e.target.value})}
                                        placeholder="예: NASDAQ:AAPL / KRX:069500"
                                        className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold text-slate-800 outline-none focus:border-emerald-500 focus:bg-white placeholder:font-normal placeholder:text-slate-300" />
                                    <p className="text-[10px] text-slate-400 ml-1">입력하면 시세 시트에 GOOGLEFINANCE 수식이 자동으로 추가됩니다</p>
                                </div>
                            )}
                        </div>
                        <div className="p-5 border-t border-slate-100 flex gap-3">
                            <button onClick={onClose} type="button" className="flex-1 py-3.5 text-slate-600 font-bold bg-slate-100 hover:bg-slate-200 rounded-2xl">취소</button>
                            <button onClick={handleAdd} type="button" className={`flex-1 py-3.5 text-white font-bold rounded-2xl shadow-lg flex justify-center items-center gap-2 ${newItem.name ? 'bg-blue-700 hover:bg-blue-800' : 'bg-blue-300 cursor-not-allowed'}`}><Icon name="Plus" className="w-4 h-4" /> 리스트에 추가</button>
                        </div>
                    </div>
                </div>
            );
        };

        const EditModal = ({ item, category, index, onClose, onSave, onDelete, marketData, currency, journal, logAction, deleteLog, onRecordSell }) => {
            const [activeTab, setActiveTab] = useState('edit');
            const [localItem, setLocalItem] = useState(() => {
                const init = { ...item };
                if (init.qty !== undefined) init.qty = init.qty.toString();
                if (init.avg !== undefined) init.avg = init.avg.toString();
                if (init.val !== undefined) init.val = init.val.toString();
                return init;
            });
            const [customLogMsg, setCustomLogMsg] = useState('');
            const [customLogDate, setCustomLogDate] = useState(() => new Date().toISOString().split('T')[0]);
            const [sellQty, setSellQty] = useState('');
            const [sellPrice, setSellPrice] = useState('');
            const [sellDate, setSellDate] = useState(() => new Date().toISOString().split('T')[0]);
            const [sellNote, setSellNote] = useState('');

            const isCash = item.val !== undefined;
            const isFixed = item.type === 'FIXED';
            const marketPrice = getMarketPrice(localItem.name, localItem.type, marketData);
            const parsedVal = parseFloat(localItem.val) || 0;
            const parsedQty = parseFloat(localItem.qty) || 0;
            const parsedAvg = parseFloat(localItem.avg) || 0;
            const estValueKRW = isCash ? parsedVal : (isFixed ? localItem.currentVal : getEstimatedValueKRW({...localItem, qty: parsedQty, avg: parsedAvg}, marketData));
            let profitRate = 0, profitColor = 'text-slate-500';
            if (!isCash && !isFixed && parsedAvg > 0) { profitRate = ((marketPrice - parsedAvg) / parsedAvg) * 100; profitColor = profitRate >= 0 ? 'text-red-500' : 'text-blue-500'; }

            const handleSave = () => {
                const saveObj = { ...localItem };
                if (isCash) saveObj.val = parsedVal;
                else { saveObj.qty = parsedQty; if (!isFixed) saveObj.avg = parsedAvg; }
                onSave(category, index, saveObj); onClose();
            };
            const assetLogs = journal ? journal.filter(j => j.name === item.name) : [];
            const handleAddCustomLog = () => { if(!customLogMsg) return; logAction('EDIT', item.name, customLogMsg, customLogDate); setCustomLogMsg(''); };

            return (
                <div className="fixed inset-0 bg-black/60 flex items-end md:items-center justify-center z-[100] animate-fadeIn p-0 md:p-4 backdrop-blur-sm" onClick={onClose}>
                    <div className="bg-white rounded-t-3xl md:rounded-3xl w-full max-w-md shadow-2xl overflow-hidden flex flex-col max-h-[90vh]" onClick={e => e.stopPropagation()}>
                        <div className="bg-slate-800 p-5 flex justify-between items-center text-white shrink-0">
                            <h3 className="font-bold text-lg flex items-center gap-3 w-[85%]">
                                <div className="p-2 bg-white/10 rounded-full border border-white/20 shrink-0"><Icon name={getAssetIconName(localItem.name)} /></div>
                                <span className="break-keep leading-snug whitespace-normal">{localItem.name}</span>
                            </h3>
                            <button onClick={onClose} type="button" className="text-white/70 hover:text-white shrink-0"><Icon name="X" /></button>
                        </div>
                        <div className="flex border-b border-slate-200 bg-slate-50 shrink-0">
                            <button onClick={() => setActiveTab('edit')} className={`flex-1 py-3 text-sm font-bold border-b-2 transition-colors ${activeTab === 'edit' ? 'border-blue-600 text-blue-700' : 'border-transparent text-slate-500'}`}>수정</button>
                            {!isCash && !isFixed && <button onClick={() => setActiveTab('sell')} className={`flex-1 py-3 text-sm font-bold border-b-2 transition-colors ${activeTab === 'sell' ? 'border-rose-500 text-rose-600' : 'border-transparent text-slate-500'}`}>매도</button>}
                            <button onClick={() => setActiveTab('journal')} className={`flex-1 py-3 text-sm font-bold border-b-2 transition-colors ${activeTab === 'journal' ? 'border-blue-600 text-blue-700' : 'border-transparent text-slate-500'}`}>기록 ({assetLogs.length})</button>
                        </div>
                        <div className="flex-1 overflow-y-auto custom-scroll">
                            {activeTab === 'edit' ? (
                                <div className="animate-fadeIn">
                                    <div className="bg-slate-50 p-6 border-b border-slate-100 text-center">
                                        <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">예상 평가 금액</p>
                                        <h2 className="text-3xl font-extrabold text-slate-800">{formatCurrency(estValueKRW, currency, marketData.exchangeRate)}</h2>
                                        {!isCash && !isFixed && <div className={`mt-2 text-sm font-bold bg-white inline-block px-3 py-1 rounded-full shadow-sm border border-slate-100 ${profitColor}`}>수익률 {profitRate >= 0 ? '+' : ''}{profitRate.toFixed(2)}%</div>}
                                    </div>
                                    <div className="p-6 space-y-5">
                                        {isCash ? (
                                            <div className="space-y-2">
                                                <label className="block text-xs font-bold text-slate-500 ml-1">보유 금액 수정</label>
                                                <div className="relative input-focus rounded-2xl border-2 border-transparent focus-within:border-blue-700">
                                                    <input type="text" value={formatWithCommas(localItem.val)} onChange={(e) => { let v = e.target.value.replace(/,/g,''); if(v.startsWith('-')||(v!==''&&!QTY_REGEX.test(v)))return; setLocalItem({...localItem,val:v}); }} className="w-full p-4 pr-12 bg-white border border-slate-200 rounded-2xl text-right text-lg font-bold text-slate-800 outline-none" />
                                                    <span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium">원</span>
                                                </div>
                                            </div>
                                        ) : (
                                            <>
                                                <div className="space-y-2">
                                                    <label className="block text-xs font-bold text-slate-500 ml-1">보유 수량</label>
                                                    <div className="relative input-focus rounded-2xl border-2 border-transparent focus-within:border-blue-700">
                                                        <input type="text" value={formatWithCommas(localItem.qty)} onChange={(e) => { let v = e.target.value.replace(/,/g,''); if(v.startsWith('-')||(v!==''&&!QTY_REGEX.test(v)))return; setLocalItem({...localItem,qty:v}); }} className="w-full p-4 pr-12 bg-white border border-slate-200 rounded-2xl text-right text-lg font-bold text-slate-800 outline-none" />
                                                        <span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium">{localItem.type === 'BTC' ? 'BTC' : '주'}</span>
                                                    </div>
                                                </div>
                                                {!isFixed && (
                                                    <div className="space-y-2">
                                                        <label className="block text-xs font-bold text-slate-500 ml-1">평균 단가</label>
                                                        <div className="relative input-focus rounded-2xl border-2 border-transparent focus-within:border-blue-700">
                                                            <input type="text" value={formatWithCommas(localItem.avg)} onChange={(e) => { let v = e.target.value.replace(/,/g,''); if(v.startsWith('-')||(v!==''&&!QTY_REGEX.test(v)))return; setLocalItem({...localItem,avg:v}); }} className="w-full p-4 pr-12 bg-white border border-slate-200 rounded-2xl text-right text-lg font-bold text-slate-800 outline-none" />
                                                            <span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium">{localItem.type === 'USD' ? '$' : '원'}</span>
                                                        </div>
                                                    </div>
                                                )}
                                                <div className="space-y-2">
                                                    <label className="block text-xs font-bold text-slate-500 ml-1">목표가 (선택)</label>
                                                    <div className="relative input-focus rounded-2xl border-2 border-transparent focus-within:border-emerald-500">
                                                        <input type="text" value={formatWithCommas(localItem.target||'')} onChange={(e)=>{let v=e.target.value.replace(/,/g,'');if(v===''||QTY_REGEX.test(v)) setLocalItem({...localItem,target:v});}} placeholder="미설정" className="w-full p-4 pr-12 bg-white border border-slate-200 rounded-2xl text-right text-lg font-bold text-slate-800 outline-none placeholder:text-slate-300" />
                                                        <span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium">{localItem.type === 'USD' ? '$' : '원'}</span>
                                                    </div>
                                                </div>
                                            </>
                                        )}
                                    </div>
                                </div>
                            ) : activeTab === 'sell' ? (
                                <div className="p-6 animate-fadeIn space-y-5">
                                    <div className="bg-rose-50 border border-rose-100 rounded-2xl p-4">
                                        <p className="text-xs font-black text-rose-700 mb-1">매도 실현손익 기록</p>
                                        <p className="text-[11px] text-rose-500">매도 수량과 매도 단가를 입력하면 실현손익이 자동 계산됩니다.</p>
                                    </div>
                                    <div className="space-y-4">
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold text-slate-500">매도 수량</label>
                                            <div className="relative"><input type="text" value={sellQty} onChange={e=>{const v=e.target.value.replace(/,/g,'');if(v===''||QTY_REGEX.test(v))setSellQty(v);}} placeholder={`보유 ${localItem.qty} ${item.type==='BTC'?'BTC':'주'}`} className="w-full p-3.5 pr-12 border border-slate-200 rounded-2xl text-right font-bold outline-none bg-white focus:border-rose-400"/><span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm">{item.type==='BTC'?'BTC':'주'}</span></div>
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold text-slate-500">매도 단가</label>
                                            <div className="relative"><input type="text" value={sellPrice} onChange={e=>{const v=e.target.value.replace(/,/g,'');if(v===''||QTY_REGEX.test(v))setSellPrice(v);}} placeholder={`현재가 ${marketPrice.toLocaleString(undefined,{maximumFractionDigits:2})}`} className="w-full p-3.5 pr-12 border border-slate-200 rounded-2xl text-right font-bold outline-none bg-white focus:border-rose-400"/><span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm">{item.type==='USD'?'$':'원'}</span></div>
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold text-slate-500">매도 일자</label>
                                            <input type="date" value={sellDate} onChange={e=>setSellDate(e.target.value)} className="w-full p-3.5 border border-slate-200 rounded-2xl font-bold outline-none bg-white focus:border-rose-400"/>
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold text-slate-500">메모 (선택)</label>
                                            <input type="text" value={sellNote} onChange={e=>setSellNote(e.target.value)} placeholder="매도 사유, 전략 등" className="w-full p-3.5 border border-slate-200 rounded-2xl font-bold outline-none bg-white focus:border-rose-400"/>
                                        </div>
                                        {sellQty && sellPrice && (() => {
                                            const qty = parseFloat(sellQty)||0, sp = parseFloat(sellPrice)||0, ap = parsedAvg;
                                            const pnlPerUnit = item.type==='USD' ? (sp - ap) * marketData.exchangeRate : (sp - ap);
                                            const totalPnl = pnlPerUnit * qty;
                                            const pnlPct = ap > 0 ? ((sp - ap)/ap*100) : 0;
                                            return (
                                                <div className={`rounded-2xl p-4 border ${totalPnl>=0?'bg-red-50 border-red-100':'bg-blue-50 border-blue-100'}`}>
                                                    <p className="text-xs font-bold text-slate-500 mb-2">예상 실현손익</p>
                                                    <p className={`text-2xl font-black ${totalPnl>=0?'text-red-600':'text-blue-600'}`}>{totalPnl>=0?'+':''}{Math.round(totalPnl).toLocaleString()}원</p>
                                                    <p className={`text-sm font-bold mt-1 ${pnlPct>=0?'text-red-500':'text-blue-500'}`}>{pnlPct>=0?'+':''}{pnlPct.toFixed(2)}% | 매수단가 {item.type==='USD'?'$':'₩'}{ap.toLocaleString(undefined,{maximumFractionDigits:2})} → {item.type==='USD'?'$':'₩'}{sp.toLocaleString(undefined,{maximumFractionDigits:2})}</p>
                                                </div>
                                            );
                                        })()}
                                    </div>
                                    <button onClick={() => {
                                        const qty = parseFloat(sellQty)||0, sp = parseFloat(sellPrice)||0, ap = parsedAvg;
                                        if(!qty||!sp){alert('수량과 매도가를 입력해주세요');return;}
                                        const pnlPerUnit = item.type==='USD' ? (sp - ap) * marketData.exchangeRate : (sp - ap);
                                        const totalPnl = pnlPerUnit * qty;
                                        const pnlPct = ap > 0 ? ((sp-ap)/ap*100) : 0;
                                        onRecordSell && onRecordSell({ name: item.name, type: item.type, qty, avgPrice: ap, sellPrice: sp, realizedGain: totalPnl, pnlPct, date: sellDate, note: sellNote });
                                        const remaining = parsedQty - qty;
                                        if(remaining > 0.0001){ onSave(category, index, {...localItem, qty: remaining}); logAction('SELL', item.name, `${qty}${item.type==='BTC'?'BTC':'주'} @${item.type==='USD'?'$':'₩'}${sp.toLocaleString(undefined,{maximumFractionDigits:2})} | 손익 ${totalPnl>=0?'+':''}${Math.round(totalPnl).toLocaleString()}원`); }
                                        else { onDelete(category, index, item); logAction('SELL', item.name, `전량 매도 @${item.type==='USD'?'$':'₩'}${sp.toLocaleString(undefined,{maximumFractionDigits:2})} | 실현손익 ${totalPnl>=0?'+':''}${Math.round(totalPnl).toLocaleString()}원`); }
                                        onClose();
                                    }} className="w-full py-4 bg-rose-600 hover:bg-rose-700 text-white font-black rounded-2xl flex items-center justify-center gap-2 shadow-lg">
                                        <Icon name="TrendingDown" className="w-5 h-5"/> 매도 기록 저장
                                    </button>
                                </div>
                            ) : (
                                <div className="p-6 animate-fadeIn space-y-6">
                                    <div className="bg-slate-50 border border-slate-200 p-4 rounded-2xl space-y-3">
                                        <h4 className="text-xs font-bold text-slate-500">새로운 기록 수동 추가</h4>
                                        <div className="flex gap-2">
                                            <input type="date" value={customLogDate} onChange={e => setCustomLogDate(e.target.value)} className="p-2 border border-slate-200 rounded-lg text-sm outline-none shrink-0" />
                                            <input type="text" placeholder="매수/매도 내용 입력" value={customLogMsg} onChange={e => setCustomLogMsg(e.target.value)} className="flex-1 p-2 border border-slate-200 rounded-lg text-sm outline-none" />
                                            <button onClick={handleAddCustomLog} className="bg-blue-600 text-white p-2 rounded-lg font-bold text-sm shrink-0">추가</button>
                                        </div>
                                    </div>
                                    <div className="space-y-3">
                                        {assetLogs.length === 0 ? <p className="text-center text-sm text-slate-400 py-4">기록이 없습니다.</p> : (
                                            assetLogs.map(log => (
                                                <div key={log.id} className="flex justify-between items-start p-3 bg-white border border-slate-100 rounded-xl shadow-sm">
                                                    <div><div className="text-[10px] font-bold text-slate-400 mb-1">{log.date.substring(0,10)}</div><div className="text-sm font-medium text-slate-800">{log.detail}</div></div>
                                                    <button onClick={() => deleteLog(log.id)} className="text-slate-300 hover:text-red-500 p-1"><Icon name="Trash2" className="w-4 h-4"/></button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                        {activeTab === 'edit' && (
                            <div className="p-5 border-t border-slate-100 bg-white flex gap-3 shrink-0 pb-safe">
                                <button onClick={() => { onDelete(category, index, item); onClose(); }} type="button" className="p-3.5 text-red-500 bg-red-50 border border-red-100 hover:bg-red-100 rounded-2xl"><Icon name="Trash2" /></button>
                                <button onClick={onClose} type="button" className="flex-1 py-3.5 text-slate-600 font-bold bg-slate-50 border border-slate-200 hover:bg-slate-100 rounded-2xl">취소</button>
                                <button onClick={handleSave} type="button" className="flex-1 py-3.5 bg-blue-700 text-white font-bold rounded-2xl shadow-lg hover:bg-blue-800 flex justify-center items-center gap-2"><Icon name="Save" className="w-4 h-4" /> 저장</button>
                            </div>
                        )}
                        {(activeTab === 'journal' || activeTab === 'sell') && <div className="pb-safe" />}
                    </div>
                </div>
            );
        };

        // ─── 5. ASSET LIST ITEMS (memoized to prevent unnecessary re-renders) ────
        const AssetItemRow = memo(({ item, category, index, onEdit, marketData, showTotal = true, currency }) => {
            const estValKRW = getEstimatedValueKRW(item, marketData);
            const marketPrice = getMarketPrice(item.name, item.type, marketData);
            const hasProfitInfo = item.avg && item.avg > 0 && item.type !== 'FIXED';
            const profitRate = hasProfitInfo ? ((marketPrice - item.avg) / item.avg) * 100 : 0;
            const iconColor = getIconColorClass(item.type, category);
            return (
                <div onClick={() => onEdit(category, index, item)} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center cursor-pointer active:scale-95 transition-transform hover:shadow-md hover:border-blue-100">
                    <div className="flex items-center gap-3.5 flex-1 min-w-0">
                        <div className={`w-11 h-11 rounded-xl flex items-center justify-center shrink-0 border shadow-sm ${iconColor}`}><Icon name={getAssetIconName(item.name)} /></div>
                        <div className="min-w-0 flex-1">
                            <div className="font-extrabold text-slate-800 text-[15px] truncate">{item.name}</div>
                            <div className="text-[13px] text-slate-500 font-medium mt-0.5 truncate">{item.val !== undefined ? '현금성 자산' : `${item.qty} ${item.type === 'BTC' ? 'BTC' : '주'}`}</div>
                        </div>
                    </div>
                    <div className="text-right pl-3 whitespace-nowrap shrink-0">
                        <div className="font-black text-slate-900 text-[15px]">{showTotal ? formatCurrency(estValKRW, currency, marketData.exchangeRate) : (currency === 'USD' ? '$****' : '****원')}</div>
                        {hasProfitInfo && <div className={`text-[11px] font-bold mt-0.5 flex items-center justify-end gap-0.5 ${profitRate >= 0 ? 'text-red-500' : 'text-blue-500'}`}>{profitRate >= 0 ? <Icon name="ArrowUpRight" className="w-3.5 h-3.5"/> : <Icon name="ArrowDownRight" className="w-3.5 h-3.5"/>}{Math.abs(profitRate).toFixed(1)}%</div>}
                    </div>
                </div>
            );
        });

        const AssetItem = memo(({ item, category, index, onEdit, marketData, currency }) => {
            const estValKRW = getEstimatedValueKRW(item, marketData);
            const marketPrice = getMarketPrice(item.name, item.type, marketData);
            const dailyChange = getDailyChange(item.name, marketData);
            const hasProfitInfo = item.avg && item.avg > 0 && item.type !== 'FIXED';
            const profitRate = hasProfitInfo ? ((marketPrice - item.avg) / item.avg) * 100 : 0;
            const changeColor = dailyChange > 0 ? 'text-red-500' : (dailyChange < 0 ? 'text-blue-500' : 'text-slate-500');
            const iconColor = getIconColorClass(item.type, category);
            return (
                <div onClick={() => onEdit(category, index, item)} className="flex items-center justify-between p-4 hover:bg-slate-50 cursor-pointer border-b border-slate-100 last:border-0 group">
                    <div className="flex items-center gap-3.5 flex-1 min-w-0">
                        <div className={`w-11 h-11 rounded-2xl flex items-center justify-center shadow-sm border shrink-0 ${iconColor}`}><Icon name={getAssetIconName(item.name)} /></div>
                        <div className="min-w-0 flex-1">
                            <div className="flex items-center gap-2">
                                <div className="font-extrabold text-slate-800 text-[15px] truncate">{item.name}</div>
                                {dailyChange !== 0 && <span className={`shrink-0 text-[10px] font-bold ${changeColor} bg-slate-100 border border-slate-200 px-1.5 py-0.5 rounded-md`}>{dailyChange > 0 ? '▲' : '▼'} {Math.abs(dailyChange)}%</span>}
                            </div>
                            <div className="text-[13px] text-slate-500 font-medium mt-0.5 truncate">
                                {item.val !== undefined ? '현금성' : <><span className="font-bold text-slate-600">{item.qty.toLocaleString()}{item.type === 'BTC' ? 'BTC' : '주'}</span><span className="text-slate-300 mx-1.5">|</span><span>{item.type === 'USD' ? '$' : '₩'}{marketPrice.toLocaleString(undefined, {maximumFractionDigits:2})}</span></>}
                            </div>
                        </div>

            const itemData = props.payload || props;
            const change = itemData._change || 0;

            const bgColor = change > 2 ? '#b91c1c' : change > 0 ? '#ef4444' : change < -2 ? '#1d4ed8' : change < 0 ? '#3b82f6' : '#94a3b8';
            const clipId = `clip-${(name||'').replace(/[^a-zA-Z0-9]/g,'')}-${Math.round(x)}-${Math.round(y)}`;
            const pad = 4;
            const innerW = Math.max(0, width - pad*2);

            const showText = innerW > 20 && innerH > 14;
            const showChange = innerH > 36;

            let fs = innerW < 45 ? 9 : innerW < 75 ? 10 : innerW < 110 ? 11 : 12;
            // truncate name to fit
            const approxCharW = fs * 0.58;
            const maxChars = Math.max(2, Math.floor(innerW / approxCharW));
            let dispName = name || '';
            if (dispName.length > maxChars) dispName = dispName.slice(0, maxChars - 1) + '…';

                        <clipPath id={clipId}>

                    <rect x={x} y={y} width={width} height={height} fill={bgColor} stroke="#ffffff" strokeWidth={1.5} rx={2}/>

                        <g clipPath={`url(#${clipId})`} style={{pointerEvents:'none'}}>

              summary:"나스닥100이 2월 한 달간 10% 하락하며 2022년 이후 최악의 월간 성과. AI 관련 빅테크 밸류에이션 부담과 트럼프 관세 불확실성의 이중고. KOSPI도 2% 하락하며 글로벌 동조 하락. 단, 유럽 방산주는 역풍 속에서도 나홀로 강세를 유지했습니다.",
              url:"https://www.cnbc.com/2026/02/22/stock-market-today-live-updates.html" },

            { keys: ["COPX","원자재","에너지"], sector:"원자재", subtitle:"Copper", icon:"Flame", color:"text-orange-600", source:"Bloomberg", date:"2026-02-10",
              title:"구리 가격 관세 우려에 3개월 저점… COPX 10% 이상 하락",
              summary:"미국 구리 관세 부과 가능성과 중국 경기 둔화로 COPX가 연초 대비 10% 넘게 하락. 하지만 AI 데이터센터·전력망 확충 수요 중장기 전망은 여전히 긍정적. 골드만삭스는 '조정 후 진입 기회'로 분석하며 12개월 목표가 $55를 유지했습니다.",
              url:"https://www.bloomberg.com/news/copper-prices-2026" }
        ];

        const MARKET_INDICES_STATIC = [
            { name:"S&P 500", value:"5,042.30", todayPct:"-1.20%", todayPts:"-60.50", weekPct:"+2.15%", weekPts:"+106.20" },
            { name:"NASDAQ 100", value:"17,920.50", todayPct:"-2.45%", todayPts:"-439.05", weekPct:"+3.40%", weekPts:"+590.10" },
            { name:"KOSPI", value:"2,650.15", todayPct:"+0.35%", todayPts:"+9.20", weekPct:"-0.80%", weekPts:"-21.40" },
            { name:"KOSDAQ", value:"850.40", todayPct:"+0.50%", todayPts:"+4.25", weekPct:"-1.20%", weekPts:"-10.30" },
            { name:"NIKKEI 225", value:"38,500.50", todayPct:"+1.10%", todayPts:"+420.30", weekPct:"+1.80%", weekPts:"+680.50" },
            { name:"VIX", value:"15.40", todayPct:"+5.20%", todayPts:"+0.76", weekPct:"-8.50%", weekPts:"-1.43" }
        ];

        const MarketPulse = ({ holdings, marketData }) => {
            const [currentTime, setCurrentTime] = useState(new Date());
            const [weather, setWeather] = useState({ temp: '로딩중...', condition: '' });
            const [tickerIndex, setTickerIndex] = useState(0);
            const [locationName, setLocationName] = useState('위치 파악중...');
            const [liveIndices, setLiveIndices] = useState({});

            // Yahoo Finance → allorigins CORS 프록시로 지수 직접 fetch
            useEffect(() => {
                const symbols = { 'S&P 500': '%5EGSPC', 'NASDAQ': '%5EIXIC', 'VIX': '%5EVIX', 'KOSPI': '%5EKS11' };
                Object.entries(symbols).forEach(([name, sym]) => {
                    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=1d`;
                    const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
                    fetch(proxy)
                        .then(r => r.json())
                        .then(data => {
                            const meta = data?.chart?.result?.[0]?.meta;
                            if (!meta) return;
                            const price = meta.regularMarketPrice;
                            const prev  = meta.chartPreviousClose || meta.previousClose || price;
                            const change = prev > 0 ? ((price - prev) / prev * 100) : 0;
                            setLiveIndices(prev => ({ ...prev, [name]: { price, change: parseFloat(change.toFixed(2)) } }));
                        })
                        .catch(() => {});
                });
            }, []);

            // ── Live news state ──────────────────────────────────────────────
            const [mineNews,   setMineNews]   = useState(null);
            const [globalNews, setGlobalNews] = useState(null);
            const [newsStatus, setNewsStatus] = useState('idle');
            const [newsUpdatedAt, setNewsUpdatedAt] = useState(null);
            const [newsFilter, setNewsFilter] = useState('mine');
            const [newsErrMsg, setNewsErrMsg] = useState('');
            const today = new Date().toISOString().split('T')[0];
            const CACHE_MINE   = 'muang_news_mine_v2';
            const CACHE_GLOBAL = 'muang_news_global_v2';

            const userHoldings = useMemo(() => {
                let assets = [];
                ['usStock','krStock','crypto','others'].forEach(cat => {
                    if(holdings?.[cat]) holdings[cat].forEach(item => {
                        if((item.qty && item.qty > 0) || (item.val && item.val > 0))
                            assets.push(item.name);
                    });
                });
                return [...new Set(assets)].slice(0, 14);
            }, [holdings]);

            const groqFetch = useCallback(async (promptText) => {
                const apiKey = localStorage.getItem('muang_groq_key') || "";
                if (!apiKey) throw new Error('NOKEY');
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: [{ role: 'user', content: promptText }],
                        max_tokens: 2048,
                        temperature: 0.7,
                    })
                });
                if (!res.ok) { const e = await res.text(); throw new Error(`HTTP ${res.status}: ${e}`); }
                const data = await res.json();
                const text = data.choices?.[0]?.message?.content || "";
                if (!text) throw new Error('Empty response');
                const m = text.match(/```json([\s\S]*?)```/) || text.match(/```([\s\S]*?)```/) || text.match(/(\[[\s\S]*\])/);
                const arr = JSON.parse(m ? m[1] : text.trim());
                if (!Array.isArray(arr) || arr.length === 0) throw new Error('Empty array');
                return arr;
            }, []);

            const schema = '{"sector":"섹터명","subtitle":"English","icon":"Globe","color":"text-slate-700","source":"outlet","date":"YYYY-MM-DD","title":"한국어 제목","summary":"한국어 2-3문장 요약","keys":["TICKER"]}';

            const fetchMineNews = useCallback(async (force = false) => {
                const holdingsList = userHoldings.join(', ');
                // 캐시 키에 보유종목 해시 포함 → 종목 바뀌면 자동 무효화
                const holdingsHash = holdingsList.split('').reduce((a,c)=>a+c.charCodeAt(0),0).toString(36);
                if (!force) {
                    try {
                        const c = JSON.parse(localStorage.getItem(CACHE_MINE) || 'null');
                        if (c?.date === today && c?.hash === holdingsHash && Array.isArray(c.articles) && c.articles.length > 0) {
                            setMineNews(c.articles); setNewsUpdatedAt(c.fetchedAt); setNewsStatus('done'); return;
                        }
                    } catch(e) {}
                }
                setNewsStatus('loading');
                const prompt = `You are a Korean financial news analyst. Today is ${today}.
The user's portfolio holdings: ${holdingsList}

Generate 8-10 news items about these SPECIFIC holdings. For each holding, create 1 relevant news item based on your knowledge about that company/asset.
Rules:
- Each item MUST be directly about one of: ${holdingsList}
- Include 1-2 macro items with keys:["MACRO"] about current global market sentiment
- title and summary MUST be in Korean (natural, fluent Korean)
- date must be within last 7 days from ${today}
- icon must be one of: TrendingUp, TrendingDown, Globe, Cpu, DollarSign, BarChart3, Shield, Zap, Activity
- DO NOT invent URLs - omit the url field entirely
- Return ONLY a valid JSON array, no markdown, no explanation
Schema for each item: ${schema}`;
                try {
                    const articles = await groqFetch(prompt);
                    const fetchedAt = new Date().toISOString();
                    localStorage.setItem(CACHE_MINE, JSON.stringify({ date: today, hash: holdingsHash, fetchedAt, articles }));
                    setMineNews(articles); setNewsUpdatedAt(fetchedAt); setNewsStatus('done');
                } catch(e) {
                    setMineNews(null);
                    setNewsStatus(e.message === 'NOKEY' ? 'nokey' : 'error');
                    setNewsErrMsg(e.message);
                }
            }, [userHoldings, today, groqFetch]);

            const fetchGlobalNews = useCallback(async (force = false) => {
                if (!force) {
                    try {
                        const c = JSON.parse(localStorage.getItem(CACHE_GLOBAL) || 'null');
                        if (c?.date === today && Array.isArray(c.articles) && c.articles.length > 0) {
                            setGlobalNews(c.articles); setNewsUpdatedAt(c.fetchedAt); setNewsStatus('done'); return;
                        }
                    } catch(e) {}
                }
                setNewsStatus('loading');
                const prompt = `You are a Korean global financial news analyst. Today is ${today}.

Based on your most recent knowledge, generate 10 significant global financial & geopolitical news items that are actually happening around ${today}.

Cover a diverse mix of whatever is most newsworthy RIGHT NOW:
- Geopolitical conflicts, tensions, wars if any are ongoing
- Central bank decisions (Fed, ECB, BOJ, BOK)
- Major market moves, crashes, rallies
- Trade disputes, sanctions, tariffs
- Political events affecting markets
- Commodity shocks (oil, gold, semiconductors)
- Major corporate events (earnings, bankruptcies, mergers)
- Climate/disaster events with economic impact
- Whatever else is most significant globally right now

Rules:
- Choose topics based on what is ACTUALLY significant as of ${today}, not a fixed list
- title and summary MUST be in Korean (natural, fluent)
- date must be within last 14 days from ${today}
- keys should be ["MACRO"] or ["GEOPOLITICS"] or ["MARKET"] as appropriate
- icon: Globe, Shield, DollarSign, TrendingDown, TrendingUp, Zap, Activity, BarChart3
- DO NOT invent URLs - omit the url field entirely
- Return ONLY a valid JSON array, no markdown, no explanation
Schema for each item: ${schema}`;
                try {
                    const articles = await groqFetch(prompt);
                    const fetchedAt = new Date().toISOString();
                    localStorage.setItem(CACHE_GLOBAL, JSON.stringify({ date: today, fetchedAt, articles }));
                    setGlobalNews(articles); setNewsUpdatedAt(fetchedAt); setNewsStatus('done');
                } catch(e) {
                    setGlobalNews(null);
                    setNewsStatus(e.message === 'NOKEY' ? 'nokey' : 'error');
                    setNewsErrMsg(e.message);
                }
            }, [today, groqFetch]);

            const fetchLiveNews = useCallback((force = false) => {
                if (newsFilter === 'mine') fetchMineNews(force);
                else fetchGlobalNews(force);
            }, [newsFilter, fetchMineNews, fetchGlobalNews]);

            // 탭 전환 시 해당 캐시 체크 후 fetch
            useEffect(() => {
                if (newsFilter === 'mine') fetchMineNews(false);
                else fetchGlobalNews(false);
            }, [newsFilter]);

            // 첫 로드
            useEffect(() => { fetchMineNews(false); }, []);

            // Fallback to static news if live fetch failed or still loading
            const displayNews = useMemo(() => {
                const liveNews = newsFilter === 'mine' ? mineNews : globalNews;
                if (liveNews && liveNews.length > 0) return liveNews;
                // Static fallback: pick relevant from NEWS_DB
                let userAssets = [];
                if(holdings) {
                    ['usStock','krStock','others','crypto'].forEach(cat => {
                        if(holdings[cat]) holdings[cat].forEach(item => { if((item.qty && item.qty > 0)||(item.val && item.val > 0)) userAssets.push(item.name.toUpperCase()); });
                    });
                }
                let matched = [], usedSectors = new Set();
                NEWS_DB.filter(n => n.keys.includes("MACRO")||n.keys.includes("GEOPOLITICS")).forEach(n => { matched.push(n); usedSectors.add(n.sector); });
                userAssets.forEach(assetName => {
                    for(let db of NEWS_DB) {
                        if(db.keys.some(k => assetName.includes(k.toUpperCase()))) {
                            if(!usedSectors.has(db.sector)) { matched.push(db); usedSectors.add(db.sector); }
                            break;
                        }
                    }
                });
                const remaining = NEWS_DB.filter(n => !n.keys.includes("MACRO") && !n.keys.includes("GEOPOLITICS"));
                let i = 0;
                while(matched.length < 9 && i < remaining.length) {
                    if(!usedSectors.has(remaining[i].sector)) { matched.push(remaining[i]); usedSectors.add(remaining[i].sector); }
                    i++;
                }
                return matched;
            }, [mineNews, globalNews, newsFilter, holdings]);

            // ── Weather ──────────────────────────────────────────────────────
            useEffect(() => {
                const fetchWeather = (lat, lon, locName) => {
                    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
                        .then(r => r.json())
                        .then(d => { setWeather({ temp:`${d.current_weather.temperature}°C`, condition:'맑음' }); if(locName) setLocationName(locName); })
                        .catch(() => { setWeather({ temp:'-', condition:'오류' }); setLocationName('날씨 오류'); });
                };
                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        async (pos) => {
                            const { latitude: lat, longitude: lon } = pos.coords;
                            try {
                                const ctrl = new AbortController();
                                const tid = setTimeout(() => ctrl.abort(), 4000);
                                const g = await fetch(
                                    `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=ko`,
                                    { signal: ctrl.signal, headers: { 'User-Agent': 'MuangBank/3.0' } }
                                );
                                clearTimeout(tid);
                                const gd = await g.json();
                                const locName = gd?.address?.suburb || gd?.address?.borough || gd?.address?.city_district || gd?.address?.city || gd?.address?.town || '현재 위치';
                                fetchWeather(lat, lon, locName);
                            } catch(e) { fetchWeather(lat, lon, '현재 위치'); }
                        },
                        () => fetchWeather(37.5665, 126.9780, '서울'),
                        { timeout: 8000, maximumAge: 300000 }
                    );
                } else { fetchWeather(37.5665, 126.9780, '서울'); }
            }, []);

            // Exchange rate ticker entry built dynamically
            const marketIndices = useMemo(() => {
                const exRateStr = marketData.exchangeRate.toLocaleString();
                const exChangeNum = marketData.exchangeChange || 0;
                const exChangeStr = exChangeNum > 0 ? `+${exChangeNum.toFixed(2)}%` : (exChangeNum < 0 ? `${exChangeNum.toFixed(2)}%` : '0.00%');
                const exPtsStr = exChangeNum !== 0 ? `${(marketData.exchangeRate * Math.abs(exChangeNum) / 100).toFixed(1)}` : '0.00';
                const exRateEntry = { name:"USD/KRW", value:exRateStr, todayPct:exChangeStr, todayPts:exPtsStr };
                // 우선순위: 직접 Yahoo fetch > GAS > static
                const gasIdx = marketData.indices || {};
                const fmt = (name, staticIdx) => {
                    const live = liveIndices[name] || gasIdx[name];
                    if (!live) return staticIdx;
                    const ch = live.change || 0;
                    const chStr = (ch >= 0 ? '+' : '') + ch.toFixed(2) + '%';
                    const pts = live.price ? (live.price * Math.abs(ch) / 100).toFixed(2) : '—';
                    return { ...staticIdx, value: live.price?.toLocaleString(undefined,{maximumFractionDigits:2}) || staticIdx.value, todayPct: chStr, todayPts: pts };
                };
                return [
                    fmt('S&P 500', MARKET_INDICES_STATIC[0]),
                    fmt('NASDAQ',  MARKET_INDICES_STATIC[1]),
                    exRateEntry,
                    fmt('KOSPI',   MARKET_INDICES_STATIC[2]),
                    fmt('VIX',     MARKET_INDICES_STATIC[5]),
                ];
            }, [marketData, liveIndices]);

            const todayInsight = useMemo(() => {
                if (!holdings || !marketData?.prices) return "데이터를 분석 중입니다...";
                let allAssets = [];
                ['usStock','krStock','others','crypto'].forEach(cat => {
                    if (holdings[cat]) holdings[cat].forEach(item => {
                        const price = getMarketPrice(item.name, item.type, marketData);
                        const finalPrice = price > 0 ? price : (item.avg || 0);
                        let val = (item.qty || 0) * finalPrice;
                        if (item.type === "USD") val *= marketData.exchangeRate;
                        if (val > 0 && item.type !== 'CASH' && item.type !== 'save' && item.type !== 'FIXED') {
                            allAssets.push({ name: item.name, value: val, change: getDailyChange(item.name, marketData) || 0 });
                        }
                    });
                });
                allAssets.sort((a,b) => b.value - a.value);
                if (allAssets.length === 0) return "자산 관리 탭에 주식/코인 종목을 등록하시면 AI가 맞춤 시황을 브리핑해 드립니다.";
                const top = allAssets[0];
                const isUp = top.change > 0, isDown = top.change < 0;
                const changeAbs = Math.abs(top.change).toFixed(2);
                const nasdaqChange = marketData.prices["KODEX 미국나스닥100"]?.change || marketData.prices["QLD"]?.change || 0;
                const prefix = isUp ? '🚀' : isDown ? '📉' : '📊';
                let message = `${prefix} 핵심 자산 [${top.name}] ${isUp?'+':isDown?'-':''}${changeAbs}%\n`;
                if (isDown) {
                    message += nasdaqChange < 0 ? `나스닥(-${Math.abs(nasdaqChange).toFixed(2)}%) 하락에 동반 조정을 받고 있습니다. 단기 변동성에 유의하시되, 보유 현금을 활용한 분할 저점 매수 기회로 활용하시기 바랍니다.`
                        : `시장 전반은 견조하나 해당 종목이 단기 약세를 보이고 있습니다. 개별 악재 여부나 차익 실현 매물 출회를 점검하시기 바랍니다.`;
                } else if (isUp) {
                    message += nasdaqChange > 0 ? `나스닥(+${Math.abs(nasdaqChange).toFixed(2)}%) 상승 흐름과 함께 자산 가치가 안정적으로 증가하고 있습니다. 상승 추세를 유지하되, 단기 과열 시 분할 매도 전략도 고려해 보십시오.`
                        : `전반적인 약세장 속에서도 해당 종목이 강세를 유지하며 포트폴리오의 하락 방어에 크게 기여하고 있습니다.`;
                } else {
                    message += `현재 해당 종목 및 시장이 뚜렷한 방향성 없이 관망세를 보이고 있습니다. 향후 변동성에 대비하여 포트폴리오 비중을 점검해 보시기 바랍니다.`;
                }
                return message;
            }, [holdings, marketData]);

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                const tickerTimer = setInterval(() => setTickerIndex(p => (p+1) % marketIndices.length), 2000);
                return () => { clearInterval(timer); clearInterval(tickerTimer); };
            }, [marketIndices.length]);

            const formatDate = (date) => {
                const days = ['일','월','화','수','목','금','토'];
                return `${date.getFullYear()}년 ${date.getMonth()+1}월 ${date.getDate()}일 (${days[date.getDay()]})`;
            };

            return (
                <div className="bg-white min-h-screen pb-24 md:pb-10 font-sans text-slate-900 animate-fadeIn">
                    {/* Top info bar */}
                    <div className="bg-white border-b border-slate-200 h-12 flex justify-center">
                        <div className="max-w-7xl w-full px-6 flex justify-between items-center text-[11px] font-bold text-slate-500 tracking-wider">
                            <div className="flex items-center gap-4">
                                <span className="flex items-center gap-1.5"><Icon name="Globe" className="w-3.5 h-3.5" /> MARKET PULSE</span>
                                <span className="text-slate-300">|</span>
                                <span className="text-blue-700 uppercase font-black tracking-widest hidden sm:inline">My Asset Dynamic News</span>
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="flex items-center gap-2 border-r border-slate-200 pr-4">
                                    <span className="text-slate-400 font-bold uppercase tracking-tighter">{locationName}</span>
